<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#08080d">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="تعذّر العثور على الصفحة التي تبحث عنها على موقع MT Academy.">
    <title>الصفحة غير موجودة | MT Academy</title>
    <link rel="icon" type="image/jpeg" sizes="1000x1000" href="/assets/images/brand/mt-academy-logo.jpg">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script defer src="/assets/js/courses-data.js"></script>
    <script defer src="/assets/js/app.js"></script>
  </head>
  <body data-page="404">
    <main class="not-found-page">
      <div class="container not-found-card">
        <div class="language-switcher not-found-language" data-language-switcher role="group" aria-label="اختيار اللغة">
          <button class="language-switcher__option is-active" type="button" data-language-option="ar" aria-label="العربية" aria-pressed="true" lang="ar">العربية</button>
          <button class="language-switcher__option" type="button" data-language-option="en" aria-label="English" aria-pressed="false" lang="en">English</button>
        </div>
        <a class="brand" href="/" data-home-link aria-label="MT Academy — الصفحة الرئيسية">
          <img
            class="brand__logo"
            src="/assets/images/brand/mt-academy-logo.jpg"
            width="1000"
            height="1000"
            alt=""
          >
          <span class="brand__name" data-config-text="brandName">MT Academy</span>
        </a>
        <p class="not-found-code" aria-hidden="true">404</p>
        <h1 data-config-text="errorPage.title">الصفحة التي تبحث عنها غير موجودة</h1>
        <p data-config-text="errorPage.description">ربما تم تغيير الرابط أو نقله. يمكنك العودة إلى الكورسات ومتابعة التصفح.</p>
        <a class="button" href="/" data-home-link data-config-text="errorPage.homeLabel">العودة إلى الصفحة الرئيسية</a>
      </div>
    </main>
  </body>
</html>
