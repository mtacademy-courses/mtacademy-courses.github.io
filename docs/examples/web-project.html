<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Explorer — example project</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111f26;color:#f8f6f2;font:20px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:1100px;padding:60px;background:#19383d;border-radius:28px;border:1px solid #3c6664}.eyebrow{color:#e8c96a;letter-spacing:.18em;font-size:15px;font-weight:800}h1{font-size:70px;margin:20px 0}p{max-width:700px;color:#dae6de;line-height:1.6}.planets{display:flex;align-items:center;gap:55px;margin:40px 0}.planet{width:72px;height:72px;border-radius:50%;background:#c47c54;box-shadow:inset -18px -12px 0 #0003}.planet:nth-child(2){background:#49b2ad;width:100px;height:100px}.planet:nth-child(3){background:#e8c96a;width:145px;height:145px}.planet:nth-child(4){background:#7c93c9}button{font:700 18px system-ui;padding:18px 25px;border:0;border-radius:12px;background:#e8c96a;color:#142d2b;cursor:pointer}#fact{display:inline-block;margin-left:25px;color:white}footer{font-size:14px;color:#a9c5bd;margin-top:40px}
</style></head><body><main><div class="eyebrow">HTML + CSS + JAVASCRIPT</div><h1>Explore our solar system.</h1><p>Welcome to my space explorer! A simple website about the things I love, with a button to discover something new.</p><div class="planets" aria-hidden="true"><div class="planet"></div><div class="planet"></div><div class="planet"></div><div class="planet"></div></div><button id="discover">Discover a planet fact ↗</button><span id="fact" aria-live="polite">Ready to explore?</span><footer>Working demonstration project · Not student work</footer></main><script>const facts=['Earth is our home planet.','Mars is known as the red planet.','Jupiter is the largest planet in our solar system.'];let index=0;document.getElementById('discover').addEventListener('click',()=>{document.getElementById('fact').textContent=facts[index++%facts.length]});</script></body></html>
